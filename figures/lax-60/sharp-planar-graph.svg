<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
  <title id="title">The five-vertex planar sharpness graph</title>
  <desc id="desc">A four-cycle on vertices one, two, three, four with center vertex zero adjacent to every rim vertex.</desc>
  <rect x="1" y="1" width="598" height="298" rx="18" fill="#f7fafb" stroke="#d8e1e5" stroke-width="2"/>
  <g fill="none" stroke="#40545d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 38 L510 150 L300 262 L90 150 Z"/>
    <path d="M300 150 L300 38"/>
    <path d="M300 150 L510 150"/>
    <path d="M300 150 L300 262"/>
    <path d="M300 150 L90 150"/>
  </g>
  <g fill="#e5f3f5" stroke="#2a7f8f" stroke-width="4">
    <circle cx="300" cy="38" r="24"/>
    <circle cx="510" cy="150" r="24"/>
    <circle cx="300" cy="262" r="24"/>
    <circle cx="90" cy="150" r="24"/>
  </g>
  <circle cx="300" cy="150" r="26" fill="#2a7f8f" stroke="#1f6470" stroke-width="4"/>
  <g fill="#203038" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="central">
    <text x="300" y="38">1</text>
    <text x="510" y="150">2</text>
    <text x="300" y="262">3</text>
    <text x="90" y="150">4</text>
  </g>
  <text x="300" y="150" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">0</text>
</svg>
